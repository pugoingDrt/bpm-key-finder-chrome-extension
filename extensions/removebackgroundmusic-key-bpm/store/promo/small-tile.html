<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Small promo tile</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #1e1e23;
    color: #f2f1ec;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: grid;
    align-content: center;
    padding: 0 36px;
    box-sizing: border-box;
    position: relative;
  }
  .bars { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); display: flex; gap: 12px; align-items: center; }
  .bars i { display: block; width: 22px; border-radius: 11px; background: #3a3a42; }
  .bars i.hot { background: #f2a93b; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin: 0 0 10px; font-size: 38px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; max-width: 230px; }
  p { margin: 0; font-size: 18px; color: #b4b4ae; font-weight: 600; }
  p b { color: #f2a93b; font-weight: 700; }
</style>
</head>
<body>
  <div class="bars" aria-hidden="true">
    <i style="height:56px"></i><i style="height:104px"></i><i class="hot" style="height:168px"></i><i style="height:88px"></i>
  </div>
  <h1>BPM &amp; Key Finder</h1>
  <p>Key <b>·</b> Camelot <b>·</b> Tempo</p>
</body>
</html>
